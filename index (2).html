<script type="text/plain" id="app-src">
/* =====================================================================
   QUADRA ESCOLAR — aplicativo web de gestão esportiva escolar
   React + TypeScript + Tailwind + Lucide. Dados em localStorage.
   ===================================================================== */
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React as any;
const LUCIDE: any = (window as any).lucideReact || {};

/* ---------- tipos ---------- */
type Role = 'admin' | 'professor' | 'monitor' | 'aluno';
interface Turma { serie: string; turma: string }
interface User { id: string; name: string; email: string; password: string; role: Role; escola: string; serie: string; turma: string; photo: string; prefMinhaTurma?: boolean }
interface Quadra { id: string; nome: string }
interface Game { id: string; modalidade: string; outra: string; a: Turma; b: Turma; responsavel: string; data: string; inicio: string; fim: string; quadraId: string; status: 'agendado' | 'cancelado'; placarA: number | null; placarB: number | null; criadoPor: string }
interface RankEntry { id: string; userId: string; gols: number; vitorias: number }
interface Evaluation { id: string; gameId: string; userId: string; tipo: 'jogador' | 'goleiro'; nota: number; comentario: string; autorId: string; criadoEm: string }
type Perms = Record<string, Record<string, boolean>>;
interface DB { users: User[]; quadras: Quadra[]; games: Game[]; ranking: RankEntry[]; evals: Evaluation[]; perms: Perms }

/* ---------- constantes ---------- */
const ROLES: Record<Role, { label: string; icon: string; desc: string }> = {
  admin: { label: 'Administrador', icon: 'ShieldCheck', desc: 'Controle total do sistema' },
  professor: { label: 'Professor', icon: 'GraduationCap', desc: 'Cria e acompanha partidas' },
  monitor: { label: 'Monitor', icon: 'ClipboardList', desc: 'Gerencia resultados e equipes' },
  aluno: { label: 'Aluno', icon: 'User', desc: 'Consulta jogos e rankings' },
};
const ROLE_ORDER: Role[] = ['admin', 'professor', 'monitor', 'aluno'];
const SERIES = ['1º ano', '2º ano', '3º ano', '4º ano', '5º ano', '6º ano', '7º ano', '8º ano', '9º ano', '1º ano do Ensino Médio', '2º ano do Ensino Médio', '3º ano do Ensino Médio'];
const TURMAS = ['A', 'B', 'C', 'D', 'E', 'F'];
const MODALIDADES = ['Futsal', 'Vôlei', 'Basquete', 'Outros'];
const PERM_DEFS = [
  { key: 'game.create', label: 'Criar partidas e agendamentos' },
  { key: 'game.edit', label: 'Editar partidas' },
  { key: 'game.cancel', label: 'Cancelar partidas' },
  { key: 'game.delete', label: 'Excluir partidas' },
  { key: 'game.result', label: 'Registrar resultados' },
  { key: 'ranking.manage', label: 'Adicionar alunos e atualizar gols e vitórias' },
  { key: 'eval.manage', label: 'Avaliar jogadores e goleiros' },
];
const DEFAULT_PERMS: Perms = {
  professor: { 'game.create': true, 'game.edit': true, 'game.cancel': true, 'game.delete': false, 'game.result': false, 'ranking.manage': true, 'eval.manage': true },
  monitor: { 'game.create': false, 'game.edit': true, 'game.cancel': true, 'game.delete': true, 'game.result': true, 'ranking.manage': true, 'eval.manage': true },
  aluno: { 'game.create': false, 'game.edit': false, 'game.cancel': false, 'game.delete': false, 'game.result': false, 'ranking.manage': false, 'eval.manage': false },
};
const isLockedPerm = (role: string, key: string) => role === 'aluno' || (role === 'monitor' && key === 'game.create');
const DEMO_PASSWORD = '123456';
const DEMO_EMAIL: Record<Role, string> = { admin: 'admin@quadra.edu.br', professor: 'professor@quadra.edu.br', monitor: 'monitor@quadra.edu.br', aluno: 'aluno@quadra.edu.br' };

/* ---------- utilitários ---------- */
const uid = (p: string) => p + '-' + Math.random().toString(36).slice(2, 9);
const pad = (n: number) => String(n).padStart(2, '0');
const toISO = (d: Date) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayOffset = (n: number) => { const d = new Date(); d.setDate(d.getDate() + n); return toISO(d); };
const parseDate = (s: string) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtLong = (s: string) => { const t = parseDate(s).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const fmtBR = (s: string) => parseDate(s).toLocaleDateString('pt-BR');
const toMin = (t: string) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = (m: number) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const atTime = (data: string, t: string) => { const d = parseDate(data); const [h, m] = t.split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
const emptyTurma = (): Turma => ({ serie: '', turma: '' });
const serieShort = (s: string) => { const n = s.split('º')[0]; return s.includes('Ensino Médio') ? `${n}º EM` : `${n}º`; };
const turmaLabel = (t?: Turma | null) => (t && t.serie && t.turma ? `${serieShort(t.serie)} ${t.turma}` : '—');
const sameTurma = (a: Turma, b: Turma) => a.serie === b.serie && a.turma === b.turma;
const modName = (g: Game) => (g.modalidade === 'Outros' ? (g.outra || 'Outros') : g.modalidade);
const modIcon = (n: string) => ({ Futsal: 'Target', 'Vôlei': 'Activity', Basquete: 'CircleDot' } as any)[n] || 'Trophy';
const firstName = (n: string) => (n || '').trim().split(' ')[0] || '';
const matchTurma = (g: Game, f: Turma) => {
  if (!f.serie) return true;
  const m = (t: Turma) => t.serie === f.serie && (!f.turma || t.turma === f.turma);
  return m(g.a) || m(g.b);
};
const matchUserTurma = (u: User, f: Turma) => !f.serie || (u.serie === f.serie && (!f.turma || u.turma === f.turma));
const gameState = (g: Game) => {
  if (g.status === 'cancelado') return 'cancelado';
  if (g.placarA !== null && g.placarB !== null) return 'finalizado';
  if (atTime(g.data, g.fim) < new Date()) return 'encerrado';
  return 'agendado';
};
const findConflict = (games: Game[], c: { id?: string; data: string; inicio: string; fim: string; quadraId: string }) =>
  games.find((g) => g.id !== c.id && g.status !== 'cancelado' && g.quadraId === c.quadraId && g.data === c.data && toMin(c.inicio) < toMin(g.fim) && toMin(g.inicio) < toMin(c.fim));
const byStart = (a: Game, b: Game) => atTime(a.data, a.inicio).getTime() - atTime(b.data, b.inicio).getTime();
const emailOk = (e: string) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e.trim());

/* ---------- armazenamento ---------- */
const DB_KEY = 'quadra-escolar:v1';
const SESSION_KEY = 'quadra-escolar:sessao';
const memStore: Record<string, string> = {};
const sGet = (k: string, area: 'local' | 'session' = 'local'): string | null => {
  try { return (area === 'local' ? localStorage : sessionStorage).getItem(k); } catch { return memStore[area + k] ?? null; }
};
const sSet = (k: string, v: string, area: 'local' | 'session' = 'local') => {
  try { (area === 'local' ? localStorage : sessionStorage).setItem(k, v); } catch { memStore[area + k] = v; }
};
const sDel = (k: string, area: 'local' | 'session' = 'local') => {
  try { (area === 'local' ? localStorage : sessionStorage).removeItem(k); } catch { delete memStore[area + k]; }
};

function seed(): DB {
  const escola = 'Colégio Estadual Horizonte';
  const mk = (id: string, name: string, email: string, role: Role, serie = '', turma = '', esc = ''): User => ({ id, name, email, password: DEMO_PASSWORD, role, escola: esc, serie, turma, photo: '' });
  const users: User[] = [
    mk('u-admin', 'Carla Mendes', DEMO_EMAIL.admin, 'admin', '', '', escola),
    mk('u-prof', 'Ricardo Alves', DEMO_EMAIL.professor, 'professor', '', '', escola),
    mk('u-mon', 'Juliana Rocha', DEMO_EMAIL.monitor, 'monitor', '3º ano do Ensino Médio', 'A'),
    mk('u-a1', 'Lucas Ferreira', DEMO_EMAIL.aluno, 'aluno', '7º ano', 'C'),
    mk('u-a2', 'Mariana Souza', 'mariana.souza@aluno.quadra.edu.br', 'aluno', '7º ano', 'A'),
    mk('u-a3', 'Pedro Henrique Lima', 'pedro.lima@aluno.quadra.edu.br', 'aluno', '8º ano', 'A'),
    mk('u-a4', 'Ana Beatriz Costa', 'ana.costa@aluno.quadra.edu.br', 'aluno', '9º ano', 'B'),
    mk('u-a5', 'Gabriel Santos', 'gabriel.santos@aluno.quadra.edu.br', 'aluno', '7º ano', 'C'),
    mk('u-a6', 'Isabela Martins', 'isabela.martins@aluno.quadra.edu.br', 'aluno', '8º ano', 'C'),
    mk('u-a7', 'Rafael Oliveira', 'rafael.oliveira@aluno.quadra.edu.br', 'aluno', '3º ano do Ensino Médio', 'C'),
    mk('u-a8', 'Camila Rodrigues', 'camila.rodrigues@aluno.quadra.edu.br', 'aluno', '2º ano do Ensino Médio', 'A'),
    mk('u-a9', 'Thiago Almeida', 'thiago.almeida@aluno.quadra.edu.br', 'aluno', '9º ano', 'D'),
    mk('u-a10', 'Larissa Barbosa', 'larissa.barbosa@aluno.quadra.edu.br', 'aluno', '1º ano do Ensino Médio', 'B'),
    mk('u-a11', 'Matheus Pereira', 'matheus.pereira@aluno.quadra.edu.br', 'aluno', '6º ano', 'B'),
    mk('u-a12', 'Beatriz Carvalho', 'beatriz.carvalho@aluno.quadra.edu.br', 'aluno', '2º ano do Ensino Médio', 'B'),
  ];
  const quadras: Quadra[] = [
    { id: 'q1', nome: 'Quadra Principal' },
    { id: 'q2', nome: 'Quadra Coberta' },
    { id: 'q3', nome: 'Quadra Externa' },
  ];
  const T = (serie: string, turma: string): Turma => ({ serie, turma });
  const G = (id: string, modalidade: string, outra: string, a: Turma, b: Turma, off: number, inicio: string, fim: string, quadraId: string, resp: string, extra: Partial<Game> = {}): Game =>
    ({ id, modalidade, outra, a, b, responsavel: resp, data: dayOffset(off), inicio, fim, quadraId, status: 'agendado', placarA: null, placarB: null, criadoPor: 'u-prof', ...extra });
  const games: Game[] = [
    G('g1', 'Futsal', '', T('7º ano', 'C'), T('7º ano', 'A'), 0, '15:30', '16:20', 'q1', 'Ricardo Alves'),
    G('g2', 'Vôlei', '', T('2º ano do Ensino Médio', 'A'), T('2º ano do Ensino Médio', 'B'), 0, '17:00', '17:50', 'q2', 'Ricardo Alves'),
    G('g3', 'Basquete', '', T('8º ano', 'A'), T('8º ano', 'C'), 1, '14:00', '14:50', 'q1', 'Ricardo Alves'),
    G('g4', 'Outros', 'Handebol', T('6º ano', 'B'), T('6º ano', 'E'), 2, '10:00', '10:50', 'q3', 'Carla Mendes', { criadoPor: 'u-admin' }),
    G('g5', 'Futsal', '', T('3º ano do Ensino Médio', 'C'), T('3º ano do Ensino Médio', 'A'), 3, '15:00', '16:00', 'q1', 'Ricardo Alves'),
    G('g6', 'Vôlei', '', T('1º ano do Ensino Médio', 'B'), T('1º ano do Ensino Médio', 'D'), 5, '13:30', '14:20', 'q2', 'Ricardo Alves'),
    G('g7', 'Futsal', '', T('7º ano', 'C'), T('7º ano', 'B'), -2, '15:00', '15:50', 'q1', 'Ricardo Alves', { placarA: 3, placarB: 1 }),
    G('g8', 'Basquete', '', T('9º ano', 'A'), T('9º ano', 'C'), -4, '14:00', '14:50', 'q2', 'Ricardo Alves', { placarA: 42, placarB: 38 }),
    G('g9', 'Outros', 'Queimada', T('5º ano', 'A'), T('5º ano', 'B'), -6, '09:00', '09:45', 'q3', 'Carla Mendes', { status: 'cancelado', criadoPor: 'u-admin' }),
    G('g10', 'Futsal', '', T('7º ano', 'A'), T('8º ano', 'B'), -1, '16:00', '16:50', 'q1', 'Ricardo Alves', { placarA: 2, placarB: 2 }),
  ];
  const R = (n: number, gols: number, vitorias: number): RankEntry => ({ id: 'r' + n, userId: 'u-a' + n, gols, vitorias });
  const ranking = [R(1, 14, 5), R(2, 9, 4), R(3, 12, 3), R(4, 7, 6), R(5, 11, 5), R(6, 5, 2), R(7, 16, 7), R(8, 8, 4), R(9, 6, 3), R(10, 3, 2)];
  const E = (n: number, gameId: string, userId: string, tipo: 'jogador' | 'goleiro', nota: number, comentario: string): Evaluation =>
    ({ id: 'e' + n, gameId, userId, tipo, nota, comentario, autorId: 'u-prof', criadoEm: dayOffset(-1) });
  const evals = [
    E(1, 'g7', 'u-a1', 'jogador', 9, 'Ótima movimentação e dois gols decisivos. Boa comunicação com a equipe.'),
    E(2, 'g7', 'u-a5', 'goleiro', 8, 'Defesas seguras e boa saída de bola.'),
    E(3, 'g8', 'u-a4', 'jogador', 7.5, 'Bom aproveitamento nos arremessos de média distância.'),
    E(4, 'g10', 'u-a2', 'jogador', 8.5, 'Marcação firme e passes precisos.'),
    E(5, 'g10', 'u-a3', 'goleiro', 7, 'Postura correta, precisa melhorar o posicionamento nas bolas aéreas.'),
  ];
  return { users, quadras, games, ranking, evals, perms: DEFAULT_PERMS };
}
function loadDB(): DB {
  try {
    const raw = sGet(DB_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.users) && p.perms) return p; }
  } catch { /* usa dados demonstrativos */ }
  const s = seed();
  sSet(DB_KEY, JSON.stringify(s));
  return s;
}

/* ---------- contexto ---------- */
const Ctx = createContext(null as any);
const useApp = () => useContext(Ctx);

/* ---------- ícone ---------- */
const Icon = ({ name, size = 20, className = '', strokeWidth = 2 }: any) => {
  const C = LUCIDE[name] || LUCIDE.Circle || (() => null);
  return <C size={size} className={className} strokeWidth={strokeWidth} aria-hidden="true" />;
};

/* ---------- componentes base ---------- */
const INPUT = 'w-full h-11 rounded-xl border border-brand-line bg-white px-3 text-base text-ink placeholder:text-mute/70 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 disabled:bg-surface disabled:text-mute disabled:cursor-not-allowed';
const TEXTAREA = 'w-full rounded-xl border border-brand-line bg-white px-3 py-2.5 text-base text-ink placeholder:text-mute/70 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20';

const Btn = ({ variant = 'primary', icon, children, className = '', ...p }: any) => {
  const v: any = {
    primary: 'bg-brand text-white hover:bg-brand-dark',
    accent: 'bg-accent text-brand-dark hover:bg-amber-500',
    dark: 'bg-brand-dark text-white hover:bg-brand',
    ghost: 'bg-white border border-brand-line text-ink hover:bg-brand-soft',
    danger: 'bg-white border border-red-200 text-red-700 hover:bg-red-50',
  };
  return (
    <button type="button" {...p} className={`inline-flex items-center justify-center gap-2 h-11 px-4 rounded-xl font-semibold text-[15px] transition-colors disabled:opacity-50 disabled:cursor-not-allowed ${v[variant]} ${className}`}>
      {icon && <Icon name={icon} size={18} />}
      {children}
    </button>
  );
};
const IconBtn = ({ icon, label, onClick, tone = 'neutral', disabled }: any) => (
  <button type="button" onClick={onClick} disabled={disabled} aria-label={label} title={label}
    className={`h-9 w-9 shrink-0 inline-flex items-center justify-center rounded-lg border transition-colors disabled:opacity-40 ${tone === 'danger' ? 'border-red-200 text-red-700 hover:bg-red-50' : 'border-brand-line text-brand-dark hover:bg-brand-soft'}`}>
    <Icon name={icon} size={16} />
  </button>
);
const Field = ({ label, htmlFor, error, hint, children }: any) => (
  <div>
    {label && <label htmlFor={htmlFor} className="block text-sm font-semibold text-ink mb-1.5">{label}</label>}
    {children}
    {hint && !error && <p className="mt-1.5 text-xs text-mute">{hint}</p>}
    {error && <p className="mt-1.5 text-sm text-red-700 flex items-center gap-1" role="alert"><Icon name="AlertCircle" size={14} />{error}</p>}
  </div>
);
const Badge = ({ tone = 'green', icon, children }: any) => {
  const t: any = { green: 'bg-brand-soft text-brand-dark', amber: 'bg-accent-soft text-accent-dark', red: 'bg-red-50 text-red-700', slate: 'bg-slate-100 text-slate-600', dark: 'bg-brand-dark text-white' };
  return <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold ${t[tone]}`}>{icon && <Icon name={icon} size={12} />}{children}</span>;
};
const Empty = ({ icon = 'CalendarX', title, text, action }: any) => (
  <div className="bg-white rounded-2xl border border-dashed border-brand-line p-8 text-center">
    <div className="mx-auto h-12 w-12 rounded-full bg-brand-soft text-brand flex items-center justify-center mb-3"><Icon name={icon} size={22} /></div>
    <p className="font-display text-xl text-ink">{title}</p>
    {text && <p className="text-sm text-mute mt-1 max-w-xs mx-auto">{text}</p>}
    {action && <div className="mt-4 flex justify-center">{action}</div>}
  </div>
);
const Avatar = ({ user, name, size = 40 }: any) => {
  const n: string = (user && user.name) || name || '?';
  const initials = n.split(' ').filter(Boolean).slice(0, 2).map((p: string) => p[0]).join('').toUpperCase();
  if (user && user.photo) return <img src={user.photo} alt={n} style={{ width: size, height: size }} className="rounded-full object-cover shrink-0 border-2 border-white/70" />;
  return <div style={{ width: size, height: size, fontSize: size * 0.4 }} className="rounded-full bg-brand text-white font-display font-semibold flex items-center justify-center shrink-0 border-2 border-white/70" aria-label={n}>{initials}</div>;
};
const Modal = ({ title, onClose, children, wide = false }: any) => {
  useEffect(() => {
    const h = (e: KeyboardEvent) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 sm:p-4" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-label={title} className={`bg-white w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-lg'} max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl shadow-card`}>
        <div className="sticky top-0 bg-white z-10 flex items-center justify-between px-5 py-4 border-b border-brand-line">
          <h2 className="font-display text-2xl text-brand-dark">{title}</h2>
          <button type="button" onClick={onClose} aria-label="Fechar" className="h-9 w-9 rounded-lg hover:bg-brand-soft inline-flex items-center justify-center text-mute"><Icon name="X" size={20} /></button>
        </div>
        <div className="p-5 pb-[max(20px,env(safe-area-inset-bottom))]">{children}</div>
      </div>
    </div>
  );
};
const Tabs = ({ value, onChange, items }: any) => (
  <div role="tablist" className="flex gap-1 bg-white border border-brand-line rounded-xl p-1 overflow-x-auto">
    {items.map((it: any) => (
      <button key={it.id} role="tab" aria-selected={value === it.id} type="button" onClick={() => onChange(it.id)}

);

/* ---------- detalhe da partida ---------- */
const GameDetail = ({ id, onClose }: any) => {
  const { db, can, update, toast, confirm, go, quadraById } = useApp();
  const g: Game | undefined = db.games.find((x: Game) => x.id === id);
  const [pa, setPa] = useState(g && g.placarA !== null ? String(g.placarA) : '');
  const [pb, setPb] = useState(g && g.placarB !== null ? String(g.placarB) : '');
  const [err, setErr] = useState('');
  if (!g) return null;
  const st = gameState(g);
  const q = quadraById(g.quadraId);
  const evalCount = db.evals.filter((e: Evaluation) => e.gameId === g.id).length;

  const saveResult = () => {
    const a = Number(pa), b = Number(pb);
    if (pa === '' || pb === '' || !Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0) { setErr('Informe o placar das duas turmas com números inteiros.'); return; }
    update((d: DB) => ({ ...d, games: d.games.map((x) => (x.id === g.id ? { ...x, placarA: a, placarB: b } : x)) }));
    setErr(''); toast('Resultado registrado.');
  };
  const clearResult = () => {
    update((d: DB) => ({ ...d, games: d.games.map((x) => (x.id === g.id ? { ...x, placarA: null, placarB: null } : x)) }));
    setPa(''); setPb(''); toast('Resultado removido.');
  };
  const toggleCancel = () => {
    if (g.status === 'cancelado') {
      const c = findConflict(db.games, g);
      if (c) { toast('Não é possível reativar: a quadra já está ocupada neste horário.', 'error'); return; }
      update((d: DB) => ({ ...d, games: d.games.map((x) => (x.id === g.id ? { ...x, status: 'agendado' } : x)) }));
      toast('Partida reativada.'); return;
    }
    confirm({
      title: 'Cancelar partida', message: `Deseja cancelar ${turmaLabel(g.a)} x ${turmaLabel(g.b)}? A quadra ficará livre neste horário.`, confirmLabel: 'Cancelar partida', danger: true,
      onConfirm: () => { update((d: DB) => ({ ...d, games: d.games.map((x) => (x.id === g.id ? { ...x, status: 'cancelado' } : x)) })); toast('Partida cancelada.'); },
    });
  };
  const remove = () => confirm({
    title: 'Excluir partida', message: 'Esta ação remove a partida e as avaliações vinculadas a ela. Não é possível desfazer.', confirmLabel: 'Excluir', danger: true,
    onConfirm: () => { update((d: DB) => ({ ...d, games: d.games.filter((x) => x.id !== g.id), evals: d.evals.filter((e) => e.gameId !== g.id) })); toast('Partida excluída.'); onClose(); },
  });

  const rows = [
    ['Trophy', 'Modalidade', modName(g)],
    ['Users', 'Confronto', `${turmaLabel(g.a)} x ${turmaLabel(g.b)}`],
    ['CalendarDays', 'Data', fmtLong(g.data)],
    ['Clock', 'Horário', `${g.inicio} às ${g.fim}`],
    ['MapPin', 'Local', q ? q.nome : 'Quadra removida'],
    ['UserCog', 'Responsável', g.responsavel],
  ];
  return (
    <Modal title="Detalhes da partida" onClose={onClose}>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        {st === 'cancelado' && <Badge tone="red" icon="Ban">Cancelada</Badge>}
        {st === 'agendado' && <Badge tone="green" icon="CalendarCheck">Agendada</Badge>}
        {st === 'finalizado' && <Badge tone="dark" icon="Flag">Finalizada: {g.placarA} x {g.placarB}</Badge>}
        {st === 'encerrado' && <Badge tone="slate">Encerrada sem resultado</Badge>}
        {evalCount > 0 && <Badge tone="amber" icon="Star">{evalCount} avaliação(ões)</Badge>}
      </div>
      <dl className="divide-y divide-brand-line border border-brand-line rounded-2xl">
        {rows.map(([ic, k, v]) => (
          <div key={k} className="flex items-center gap-3 px-4 py-3">
            <span className="h-8 w-8 rounded-lg bg-brand-soft text-brand flex items-center justify-center shrink-0"><Icon name={ic} size={16} /></span>
            <dt className="text-sm text-mute w-24 shrink-0">{k}</dt>
            <dd className="text-sm font-semibold text-ink min-w-0 break-words">{v}</dd>
          </div>
        ))}
      </dl>

      {can('game.result') && st !== 'cancelado' && (
        <div className="mt-4 rounded-2xl border border-brand-line p-4">
          <p className="font-semibold text-ink mb-3 flex items-center gap-2"><Icon name="Flag" size={16} className="text-brand" />Registrar resultado</p>
          <div className="grid grid-cols-[1fr_auto_1fr] gap-3 items-end">
            <Field label={turmaLabel(g.a)} htmlFor="placar-a"><input id="placar-a" type="number" min="0" inputMode="numeric" className={INPUT} value={pa} onChange={(e: any) => setPa(e.target.value)} /></Field>
            <span className="pb-3 font-display text-xl text-mute">x</span>
            <Field label={turmaLabel(g.b)} htmlFor="placar-b"><input id="placar-b" type="number" min="0" inputMode="numeric" className={INPUT} value={pb} onChange={(e: any) => setPb(e.target.value)} /></Field>
          </div>
          {err && <p className="mt-2 text-sm text-red-700" role="alert">{err}</p>}
          <div className="mt-3 flex gap-2">
            <Btn onClick={saveResult} icon="Save" className="flex-1">Salvar resultado</Btn>
            {g.placarA !== null && <Btn variant="ghost" onClick={clearResult}>Limpar</Btn>}
          </div>
        </div>
      )}

      <div className="mt-4 grid gap-2 sm:grid-cols-2">
        {can('eval.manage') && st !== 'cancelado' && <Btn variant="dark" icon="Star" onClick={() => { onClose(); go('avaliacoes', { gameId: g.id }); }}>Avaliar jogadores</Btn>}
        {can('game.edit') && <Btn variant="ghost" icon="Pencil" onClick={() => { onClose(); go('agendamento-form', { id: g.id }); }}>Editar</Btn>}
        {can('game.cancel') && <Btn variant="ghost" icon={g.status === 'cancelado' ? 'RotateCcw' : 'Ban'} onClick={toggleCancel}>{g.status === 'cancelado' ? 'Reativar partida' : 'Cancelar partida'}</Btn>}
        {can('game.delete') && <Btn variant="danger" icon="Trash2" onClick={remove}>Excluir</Btn>}
      </div>
      {!can('game.edit') && !can('game.cancel') && !can('game.delete') && !can('game.result') && (
        <p className="mt-4 text-xs text-mute flex items-center gap-1.5"><Icon name="Eye" size={14} />Seu perfil possui acesso somente para visualização.</p>
      )}
    </Modal>
  );
};

/* ---------- FORMULÁRIO DE AGENDAMENTO ---------- */
const GameForm = ({ id }: any) => {
  const { db, user, can, update, toast, go } = useApp();
  const editing: Game | undefined = id ? db.games.find((g: Game) => g.id === id) : undefined;
  const allowed = editing ? can('game.edit') : can('game.create');
  const [f, setF] = useState(() => editing
    ? { modalidade: editing.modalidade, outra: editing.outra, a: editing.a, b: editing.b, responsavel: editing.responsavel, data: editing.data, inicio: editing.inicio, fim: editing.fim, quadraId: editing.quadraId }
    : { modalidade: 'Futsal', outra: '', a: emptyTurma(), b: emptyTurma(), responsavel: user.name, data: '', inicio: '', fim: '', quadraId: db.quadras[0] ? db.quadras[0].id : '' });
  const [err, setErr] = useState({} as any);
  if (!allowed) return <div><PageHeader title="Agendamento" back="agendamentos" /><NoAccess /></div>;
  if (id && !editing) return <div><PageHeader title="Agendamento" back="agendamentos" /><Empty title="Partida não encontrada" text="Ela pode ter sido excluída por outro usuário." /></div>;
  const set = (k: string, v: any) => { setF((p: any) => ({ ...p, [k]: v })); setErr((p: any) => ({ ...p, [k]: undefined, conflito: undefined })); };

  const submit = (e: any) => {
    e.preventDefault();
    const x: any = {};
    if (f.modalidade === 'Outros' && !f.outra.trim()) x.outra = 'Digite o nome da modalidade.';
    if (!f.a.serie || !f.a.turma) x.a = 'Selecione a série e a turma participante.';
    if (!f.b.serie || !f.b.turma) x.b = 'Selecione a série e a turma adversária.';
    if (!x.a && !x.b && sameTurma(f.a, f.b)) x.b = 'A turma adversária deve ser diferente da participante.';
    if (!f.responsavel.trim()) x.responsavel = 'Informe o nome do responsável.';
    if (!f.data) x.data = 'Escolha a data da partida.';
    else if ((!editing || editing.data !== f.data) && f.data < toISO(new Date())) x.data = 'A data não pode estar no passado.';
    if (!f.inicio) x.inicio = 'Informe o horário de início.';
    if (!f.fim) x.fim = 'Informe o horário de término.';
    if (f.inicio && f.fim && toMin(f.fim) <= toMin(f.inicio)) x.fim = 'O término deve ser depois do início.';
    if (!f.quadraId) x.quadraId = 'Selecione a quadra.';
    if (!Object.keys(x).length) {
      const c = findConflict(db.games, { id: editing ? editing.id : undefined, data: f.data, inicio: f.inicio, fim: f.fim, quadraId: f.quadraId });
      if (c) x.conflito = `Conflito de horário: a quadra já está reservada para ${turmaLabel(c.a)} x ${turmaLabel(c.b)} das ${c.inicio} às ${c.fim}.`;
    }
    setErr(x);
    if (Object.keys(x).length) return;
    const clean = { ...f, outra: f.modalidade === 'Outros' ? f.outra.trim() : '', responsavel: f.responsavel.trim() };
    if (editing) {
      update((d: DB) => ({ ...d, games: d.games.map((g) => (g.id === editing.id ? { ...g, ...clean } : g)) }));
      toast('Agendamento atualizado.');
    } else {
      const novo: Game = { id: uid('g'), ...clean, status: 'agendado', placarA: null, placarB: null, criadoPor: user.id };
      update((d: DB) => ({ ...d, games: [...d.games, novo] }));
      toast('Agendamento confirmado.');
    }
    go('agendamentos');
  };

  return (
    <form onSubmit={submit} noValidate className="space-y-5">
      <PageHeader title={editing ? 'Editar Agendamento' : 'Novo Agendamento'} back="agendamentos" />
      {err.conflito && (
        <div role="alert" className="flex gap-3 rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">
          <Icon name="AlertTriangle" size={18} className="shrink-0 mt-0.5" /><p>{err.conflito}</p>
        </div>
      )}
      <div className="bg-white rounded-2xl border border-brand-line shadow-soft p-4 space-y-5">
        <div>
          <p className="block text-sm font-semibold text-ink mb-1.5">Modalidade</p>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2" role="radiogroup" aria-label="Modalidade">
            {MODALIDADES.map((m) => (
              <button key={m} type="button" role="radio" aria-checked={f.modalidade === m} onClick={() => set('modalidade', m)}
                className={`h-11 rounded-xl border text-sm font-semibold inline-flex items-center justify-center gap-2 transition-colors ${f.modalidade === m ? 'border-brand bg-brand text-white' : 'border-brand-line bg-white text-ink hover:bg-brand-soft'}`}>
                <Icon name={modIcon(m)} size={16} />{m}
              </button>
            ))}
          </div>
        </div>
        {f.modalidade === 'Outros' && (
          <Field label="Nome da modalidade" htmlFor="outra" error={err.outra} hint="Exemplos: Handebol, Queimada, Atletismo, Badminton.">
            <input id="outra" className={INPUT} value={f.outra} maxLength={40} placeholder="Digite a modalidade" onChange={(e: any) => set('outra', e.target.value)} />
          </Field>
        )}
        <Field label="Turma participante" error={err.a}><SerieTurma id="fa" value={f.a} onChange={(v: Turma) => set('a', v)} /></Field>
        <Field label="Turma adversária" error={err.b}><SerieTurma id="fb" value={f.b} onChange={(v: Turma) => set('b', v)} /></Field>
        <Field label="Nome do responsável" htmlFor="resp" error={err.responsavel}>
          <input id="resp" className={INPUT} value={f.responsavel} onChange={(e: any) => set('responsavel', e.target.value)} />
        </Field>
        <div className="grid sm:grid-cols-3 gap-4">
          <Field label="Data da partida" htmlFor="data" error={err.data}><input id="data" type="date" className={INPUT} value={f.data} onChange={(e: any) => set('data', e.target.value)} /></Field>
          <Field label="Início" htmlFor="inicio" error={err.inicio}><input id="inicio" type="time" className={INPUT} value={f.inicio} onChange={(e: any) => set('inicio', e.target.value)} /></Field>
          <Field label="Término" htmlFor="fim" error={err.fim}><input id="fim" type="time" className={INPUT} value={f.fim} onChange={(e: any) => set('fim', e.target.value)} /></Field>
        </div>
        <Field label="Quadra" htmlFor="quadra" error={err.quadraId}>
          <select id="quadra" className={INPUT} value={f.quadraId} onChange={(e: any) => set('quadraId', e.target.value)}>
            <option value="">Selecione a quadra</option>
            {db.quadras.map((q: Quadra) => <option key={q.id} value={q.id}>{q.nome}</option>)}
          </select>
        </Field>
      </div>
      <div className="flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
        <Btn variant="ghost" onClick={() => go('agendamentos')}>Cancelar</Btn>
        <Btn type="submit" icon="CalendarCheck">{editing ? 'Salvar alterações' : 'Confirmar Agendamento'}</Btn>
      </div>
    </form>
  );
};

/* ---------- AGENDAMENTOS ---------- */
const Disponibilidade = () => {
  const { db } = useApp();
  const [data, setData] = useState(toISO(new Date()));
  const OPEN = 7 * 60, CLOSE = 18 * 60;
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border border-brand-line shadow-soft p-4">
        <Field label="Consultar data" htmlFor="disp-data" hint="Horários livres consideram o funcionamento das quadras das 07:00 às 18:00.">
          <input id="disp-data" type="date" className={INPUT} value={data} onChange={(e: any) => setData(e.target.value)} />
        </Field>
      </div>
      {db.quadras.length === 0 && <Empty icon="MapPin" title="Nenhuma quadra cadastrada" />}
      {db.quadras.map((q: Quadra) => {
        const busy = db.games.filter((g: Game) => g.quadraId === q.id && g.data === data && g.status !== 'cancelado').sort(byStart);
        const free: number[][] = [];
        let cur = OPEN;
        busy.forEach((g: Game) => { if (toMin(g.inicio) - cur >= 20) free.push([cur, toMin(g.inicio)]); cur = Math.max(cur, toMin(g.fim)); });
        if (CLOSE - cur >= 20) free.push([cur, CLOSE]);
        return (
          <div key={q.id} className="bg-white rounded-2xl border border-brand-line shadow-soft p-4">
            <p className="font-display text-2xl text-brand-dark flex items-center gap-2"><Icon name="MapPin" size={18} className="text-brand" />{q.nome}</p>
            <p className="text-xs font-semibold uppercase tracking-wide text-mute mt-3 mb-1.5">Livre</p>
            <div className="flex flex-wrap gap-2">
              {free.length ? free.map(([a, b], i) => <Badge key={i} tone="green" icon="Check">{fromMin(a)} às {fromMin(b)}</Badge>) : <span className="text-sm text-mute">Sem horários livres neste dia.</span>}
            </div>
            <p className="text-xs font-semibold uppercase tracking-wide text-mute mt-3 mb-1.5">Ocupada</p>
            <div className="flex flex-wrap gap-2">
              {busy.length ? busy.map((g: Game) => <Badge key={g.id} tone="amber" icon="Clock">{g.inicio} às {g.fim} · {turmaLabel(g.a)} x {turmaLabel(g.b)}</Badge>) : <span className="text-sm text-mute">Nenhuma reserva.</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
};

const Agendamentos = () => {
  const { db, can, go } = useApp();
  const [tab, setTab] = useState('futuras');
  const [mod, setMod] = useState('');
  const [turma, setTurma] = useState(emptyTurma());
  const [data, setData] = useState('');
  const [open, setOpen] = useState(false);
  const mods = useMemo(() => {
    const extra = Array.from(new Set(db.games.filter((g: Game) => g.modalidade === 'Outros' && g.outra).map((g: Game) => g.outra))) as string[];
    return ['Futsal', 'Vôlei', 'Basquete', ...extra.sort((a, b) => a.localeCompare(b, 'pt-BR'))];
  }, [db.games]);
  const filtered = db.games.filter((g: Game) => (!mod || modName(g) === mod) && matchTurma(g, turma) && (!data || g.data === data));
  const now = new Date();
  const futuras = filtered.filter((g: Game) => g.status !== 'cancelado' && atTime(g.data, g.fim) >= now).sort(byStart);
  const anteriores = filtered.filter((g: Game) => g.status !== 'cancelado' && atTime(g.data, g.fim) < now).sort((a: Game, b: Game) => byStart(b, a));
  const canceladas = filtered.filter((g: Game) => g.status === 'cancelado').sort(byStart);
  const list = tab === 'futuras' ? futuras : tab === 'anteriores' ? anteriores : canceladas;
  const grouped: Record<string, Game[]> = {};
  list.forEach((g: Game) => { (grouped[g.data] = grouped[g.data] || []).push(g); });
  const nFilters = (mod ? 1 : 0) + (turma.serie ? 1 : 0) + (data ? 1 : 0);

  return (
    <div className="space-y-4">
      <PageHeader title="Agendamentos" subtitle="Partidas entre turmas e uso das quadras"
        action={can('game.create') && <Btn variant="accent" icon="Plus" className="hidden sm:inline-flex" onClick={() => go('agendamento-form')}>Novo Agendamento</Btn>} />
      {can('game.create') && <Btn variant="accent" icon="Plus" className="w-full sm:hidden" onClick={() => go('agendamento-form')}>Novo Agendamento</Btn>}
      <Tabs value={tab} onChange={setTab} items={[
        { id: 'futuras', label: 'Futuras', count: futuras.length },
        { id: 'anteriores', label: 'Anteriores', count: anteriores.length },
        { id: 'canceladas', label: 'Canceladas', count: canceladas.length },
        { id: 'disponibilidade', label: 'Disponibilidade' },
      ]} />
      {tab === 'disponibilidade' ? <Disponibilidade /> : (
        <>
          <div className="bg-white rounded-2xl border border-brand-line shadow-soft">
            <button type="button" onClick={() => setOpen(!open)} aria-expanded={open} className="w-full flex items-center justify-between px-4 h-12 font-semibold text-ink">
              <span className="inline-flex items-center gap-2"><Icon name="Filter" size={16} className="text-brand" />Filtros{nFilters > 0 && <Badge tone="amber">{nFilters}</Badge>}</span>
              <Icon name={open ? 'ChevronUp' : 'ChevronDown'} size={18} className="text-mute" />
            </button>
            {open && (
              <div className="px-4 pb-4 space-y-4 border-t border-brand-line pt-4">
                <Field label="Modalidade" htmlFor="f-mod">
                  <select id="f-mod" className={INPUT} value={mod} onChange={(e: any) => setMod(e.target.value)}>
                    <option value="">Todas as modalidades</option>
                    {mods.map((m) => <option key={m} value={m}>{m}</option>)}
                  </select>
                </Field>
                <Field label="Turma"><SerieTurma id="f-turma" value={turma} onChange={setTurma} optional /></Field>
                <Field label="Data" htmlFor="f-data"><input id="f-data" type="date" className={INPUT} value={data} onChange={(e: any) => setData(e.target.value)} /></Field>
                {nFilters > 0 && <Btn variant="ghost" icon="X" onClick={() => { setMod(''); setTurma(emptyTurma()); setData(''); }}>Limpar filtros</Btn>}
              </div>
            )}
          </div>
          {list.length === 0 ? (
            <Empty title={tab === 'futuras' ? 'Nenhuma partida futura' : tab === 'anteriores' ? 'Nenhuma partida anterior' : 'Nenhuma partida cancelada'} text={nFilters ? 'Ajuste ou limpe os filtros para ver mais resultados.' : undefined} />
          ) : (
            Object.keys(grouped).map((d) => (
              <section key={d}>
                <h2 className="text-xs font-bold uppercase tracking-wider text-mute mb-2">{fmtLong(d)}</h2>
                <div className="space-y-3">{grouped[d].map((g) => <GameCard key={g.id} g={g} />)}</div>
              </section>
            ))
          )}
        </>
      )}
    </div>
  );
};

/* ---------- RANKINGS ---------- */
const Stepper = ({ value, onChange, label }: any) => (
  <div className="inline-flex items-center gap-1" role="group" aria-label={label}>
    <button type="button" aria-label={`Diminuir ${label}`} onClick={() => onChange(Math.max(0, value - 1))} className="h-8 w-8 rounded-lg border border-brand-line text-brand-dark hover:bg-brand-soft inline-flex items-center justify-center"><Icon name="Minus" size={14} /></button>
    <input aria-label={label} type="number" min="0" inputMode="numeric" value={value} onChange={(e: any) => { const n = parseInt(e.target.value, 10); onChange(Number.isNaN(n) ? 0 : Math.max(0, n)); }} className="h-8 w-14 rounded-lg border border-brand-line text-center text-base font-semibold text-ink focus:outline-none focus:border-brand" />
    <button type="button" aria-label={`Aumentar ${label}`} onClick={() => onChange(value + 1)} className="h-8 w-8 rounded-lg border border-brand-line text-brand-dark hover:bg-brand-soft inline-flex items-center justify-center"><Icon name="Plus" size={14} /></button>
  </div>
);
const MEDAL: any = { 1: { c: 'text-accent', ring: 'ring-accent', label: 'Ouro' }, 2: { c: 'text-slate-400', ring: 'ring-slate-300', label: 'Prata' }, 3: { c: 'text-amber-700', ring: 'ring-amber-700/60', label: 'Bronze' } };

const Rankings = () => {
  const { db, can, userById, update, toast, confirm } = useApp();
  const [tab, setTab] = useState('gols');
  const [filtro, setFiltro] = useState(emptyTurma());
  const [edit, setEdit] = useState(false);
  const [full, setFull] = useState(false);
  const [adding, setAdding] = useState(false);
  const manage = can('ranking.manage');
  const metric = tab as 'gols' | 'vitorias';
  const rows: any[] = db.ranking
    .map((r: RankEntry) => ({ r, u: userById(r.userId) }))
    .filter((x: any) => x.u && matchUserTurma(x.u, filtro))
    .sort((a: any, b: any) => b.r[metric] - a.r[metric] || a.u.name.localeCompare(b.u.name, 'pt-BR'));
  rows.forEach((x, i) => { x.pos = i > 0 && x.r[metric] === rows[i - 1].r[metric] ? rows[i - 1].pos : i + 1; });
  const top = rows.slice(0, 3);
  const rest = rows.slice(3);
  const shown = full ? rest : rest.slice(0, 7);
  const podium = [top[1], top[0], top[2]].filter(Boolean);
  const unit = metric === 'gols' ? 'gols' : 'vitórias';

  const setVal = (id: string, field: 'gols' | 'vitorias', v: number) =>
    update((d: DB) => ({ ...d, ranking: d.ranking.map((r) => (r.id === id ? { ...r, [field]: v } : r)) }));
  const remove = (r: RankEntry, name: string) => confirm({
    title: 'Remover do ranking', message: `${name} será removido(a) do ranking. As avaliações permanecem registradas.`, confirmLabel: 'Remover', danger: true,
    onConfirm: () => { update((d: DB) => ({ ...d, ranking: d.ranking.filter((x) => x.id !== r.id) })); toast('Aluno removido do ranking.'); },
  });
  const renderControls = (x: any) => (
    <div className="flex items-center gap-2 flex-wrap justify-center">
      <Stepper label={unit} value={x.r[metric]} onChange={(v: number) => setVal(x.r.id, metric, v)} />
      <IconBtn icon="Trash2" tone="danger" label="Remover do ranking" onClick={() => remove(x.r, x.u.name)} />
    </div>
  );

  return (
    <div className="space-y-4">
      <PageHeader title="Rankings" subtitle="Classificação dos alunos" />
      <Tabs value={tab} onChange={setTab} items={[{ id: 'gols', label: 'Gols' }, { id: 'vitorias', label: 'Vitórias' }]} />
      <div className="bg-white rounded-2xl border border-brand-line shadow-soft p-4">
        <p className="text-sm font-semibold text-ink mb-3 flex items-center gap-2"><Icon name="Filter" size={16} className="text-brand" />Filtrar por turma</p>
        <SerieTurma id="rk" value={filtro} onChange={setFiltro} optional />
      </div>
      {manage && (
        <div className="flex gap-2 flex-wrap">
          <Btn icon="UserPlus" onClick={() => setAdding(true)}>Adicionar aluno</Btn>
          <Btn variant={edit ? 'dark' : 'ghost'} icon={edit ? 'Check' : 'Pencil'} onClick={() => setEdit(!edit)}>{edit ? 'Concluir edição' : 'Atualizar pontuações'}</Btn>
        </div>
      )}
      {rows.length === 0 ? (
        <Empty icon="Trophy" title="Ranking vazio" text={filtro.serie ? 'Nenhum aluno desta turma no ranking.' : 'Nenhum aluno foi adicionado ao ranking ainda.'} />
      ) : (
        <>
          <section className="rounded-3xl bg-gradient-to-b from-brand-dark to-brand p-4 pt-6 shadow-card" aria-label="Três primeiros colocados">
            <div className="flex items-end justify-center gap-2 sm:gap-4">
              {podium.map((x: any) => {
                const m = MEDAL[Math.min(x.pos, 3)];
                const first = x.pos === 1;
                return (
                  <div key={x.r.id} className={`flex-1 max-w-[190px] min-w-0 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 px-2 pb-3 text-center text-white ${first ? 'pt-5 pb-5' : 'pt-3'}`}>
                    <div className="flex justify-center -mt-1"><Icon name="Medal" size={first ? 30 : 24} className={m.c} /></div>
                    <div className="flex justify-center mt-1"><Avatar user={x.u} size={first ? 64 : 52} /></div>
                    <p className="mt-2 text-sm font-semibold leading-tight truncate" title={x.u.name}>{x.u.name}</p>
                    <p className="text-xs text-white/70">{turmaLabel(x.u)}</p>
                    <p className="font-display text-4xl leading-none mt-1.5">{x.r[metric]}</p>
                    <p className="text-[11px] uppercase tracking-wider text-white/70">{m.label} · {x.pos}º</p>
                    {manage && edit && <div className="mt-2 bg-white rounded-xl p-1.5 text-ink">{renderControls(x)}</div>}
                  </div>
                );
              })}
            </div>
          </section>
          {rest.length > 0 && (
            <ol className="bg-white rounded-2xl border border-brand-line shadow-soft divide-y divide-brand-line">
              {shown.map((x: any) => (
                <li key={x.r.id} className="px-4 py-3">
                  <div className="flex items-center gap-3">
                    <span className="w-8 text-center font-display text-2xl text-mute">{x.pos}</span>
                    <Avatar user={x.u} size={40} />
                    <div className="min-w-0 flex-1">
                      <p className="font-semibold text-ink truncate">{x.u.name}</p>
                      <p className="text-xs text-mute">{turmaLabel(x.u)}</p>
                    </div>
                    <div className="text-right"><p className="font-display text-3xl text-brand-dark leading-none">{x.r[metric]}</p><p className="text-[11px] text-mute uppercase tracking-wide">{unit}</p></div>
                  </div>
                  {manage && edit && <div className="mt-3 flex justify-end">{renderControls(x)}</div>}
                </li>
              ))}
            </ol>
          )}
          {rest.length > 7 && (
            <Btn variant="ghost" className="w-full" icon={full ? 'ChevronUp' : 'ListOrdered'} onClick={() => setFull(!full)}>{full ? 'Mostrar menos' : 'Ver Ranking Completo'}</Btn>
          )}
        </>
      )}
      {adding && <AddRank onClose={() => setAdding(false)} />}
    </div>
  );
};

const AddRank = ({ onClose }: any) => {
  const { db, update, toast } = useApp();
  const used = new Set(db.ranking.map((r: RankEntry) => r.userId));
  const available = db.users.filter((u: User) => u.role === 'aluno' && !used.has(u.id)).sort((a: User, b: User) => a.name.localeCompare(b.name, 'pt-BR'));
  const [sel, setSel] = useState('');
  const [gols, setGols] = useState(0);
  const [vit, setVit] = useState(0);
  const [err, setErr] = useState('');
  const save = () => {
    if (!sel) { setErr('Selecione um aluno.'); return; }
    update((d: DB) => ({ ...d, ranking: [...d.ranking, { id: uid('r'), userId: sel, gols, vitorias: vit }] }));
    toast('Aluno adicionado ao ranking.'); onClose();
  };
  return (
    <Modal title="Adicionar aluno ao ranking" onClose={onClose}>
      {available.length === 0 ? (
        <Empty icon="Users" title="Todos os alunos já estão no ranking" text="Cadastre novos alunos na área de usuários (somente administrador)." />
      ) : (
        <div className="space-y-4">
          <Field label="Aluno" htmlFor="rk-aluno" error={err}>
            <select id="rk-aluno" className={INPUT} value={sel} onChange={(e: any) => { setSel(e.target.value); setErr(''); }}>
              <option value="">Selecione o aluno</option>
              {available.map((u: User) => <option key={u.id} value={u.id}>{u.name} ({turmaLabel(u)})</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Gols iniciais"><Stepper label="gols" value={gols} onChange={setGols} /></Field>
            <Field label="Vitórias iniciais"><Stepper label="vitórias" value={vit} onChange={setVit} /></Field>
          </div>
          <Btn icon="UserPlus" className="w-full" onClick={save}>Adicionar ao ranking</Btn>
        </div>
      )}
    </Modal>
  );
};

/* ---------- AVALIAÇÕES ---------- */
const Avaliacoes = ({ gameId }: any) => {
  const { db, user, can, userById, update, toast, confirm } = useApp();
  const manage = can('eval.manage');
  const [form, setForm] = useState(gameId && manage ? { gameId } : (null as any));
  const [fAluno, setFAluno] = useState('');
  const [fTipo, setFTipo] = useState('');
  let list: Evaluation[] = db.evals.slice();
  if (!manage) list = list.filter((e) => e.userId === user.id);
  else {
    if (fAluno) list = list.filter((e) => e.userId === fAluno);
    if (gameId) list = list.filter((e) => e.gameId === gameId);

  if (fTipo) list = list.filter((e) => e.tipo === fTipo);
  list.sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));

        <div className="bg-white rounded-2xl border border-brand-line shadow-soft p-4"><p className="text-sm font-semibold text-mute">Nota média</p><p className="font-display text-4xl text-accent-dark leading-none mt-1">{avg}</p></div>

          <select aria-label="Filtrar por aluno" className={INPUT} value={fAluno} onChange={(e: any) => setFAluno(e.target.value)}>
            <option value="">Todos os alunos</option>
            {alunos.map((u: User) => <option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
        )}
        <select aria-label="Filtrar por tipo" className={INPUT} value={fTipo} onChange={(e: any) => setFTipo(e.target.value)}>
          <option value="">Jogadores e goleiros</option><option value="jogador">Somente jogadores</option><option value="goleiro">Somente goleiros</option>
        </select>
      </div>
      {list.length === 0 ? <Empty icon="Star" title="Nenhuma avaliação" text={manage ? 'Use o botão Nova avaliação para registrar a primeira.' : 'Você ainda não recebeu avaliações.'} /> : (
        <div className="space-y-3">
          {list.map((e) => {
            const u = userById(e.userId); const au = userById(e.autorId);
            return (
              <article key={e.id} className="bg-white rounded-2xl border border-brand-line shadow-soft p-4">

                      {u && <span className="text-xs text-mute">{turmaLabel(u)}</span>}

                    <div className="flex gap-2">
                      <IconBtn icon="Pencil" label="Editar avaliação" onClick={() => setForm(e)} />

                        title: 'Excluir avaliação', message: 'Esta avaliação será removida do perfil do aluno.', confirmLabel: 'Excluir', danger: true,
                        onConfirm: () => { update((d: DB) => ({ ...d, evals: d.evals.filter((x) => x.id !== e.id) })); toast('Avaliação excluída.'); },
                      })} />

const EvalForm = ({ initial, onClose }: any) => {

const processImage = (file: File): Promise<string> => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onerror = () => rej(new Error('Falha ao ler a imagem.'));
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => rej(new Error('Arquivo de imagem inválido.'));
    img.onload = () => {
      const s = 320; const c = document.createElement('canvas'); c.width = s; c.height = s;
      const ctx = c.getContext('2d') as CanvasRenderingContext2D;
      const m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = fr.result as string;
  };
  fr.readAsDataURL(file);
});

  if (role === 'aluno') stats.push(['Gols', rank ? rank.gols : 0, 'Target'], ['Vitórias', rank ? rank.vitorias : 0, 'Trophy'], ['Avaliações', evs, 'Star']);
  else stats.push(['Total de partidas', games.length, 'CalendarDays']);
  return (

                  return (
                    <td key={r} className="px-2 py-3 text-center">
                      <button type="button" role="switch" aria-checked={on} aria-label={`${p.label} para ${ROLES[r].label}`} disabled={locked} onClick={() => toggle(r, p.key)}
                        className={`h-9 w-9 rounded-lg inline-flex items-center justify-center border transition-colors ${on ? 'bg-brand text-white border-brand' : 'bg-white text-mute border-brand-line'} ${locked ? 'opacity-60 cursor-not-allowed' : 'hover:border-brand'}`}>
                        <Icon name={locked ? 'Lock' : on ? 'Check' : 'X'} size={15} />
                      </button>
                    </td>
                  );

    </div>
  );
};

const Quadras = () => {
  const { db, isAdmin, update, toast, confirm } = useApp();
  const [form, setForm] = useState(null as any);
  const [nome, setNome] = useState('');
  const [err, setErr] = useState('');
  if (!isAdmin) return <NoAccess />;
  const openForm = (q: any) => { setForm(q); setNome(q.nome || ''); setErr(''); };
  const save = (e: any) => {
    e.preventDefault();
    const n = nome.trim();
    if (!n) { setErr('Informe o nome da quadra.'); return; }
    if (db.quadras.some((q: Quadra) => q.id !== form.id && q.nome.toLowerCase() === n.toLowerCase())) { setErr('Já existe uma quadra com este nome.'); return; }
    if (form.id) update((d: DB) => ({ ...d, quadras: d.quadras.map((q) => (q.id === form.id ? { ...q, nome: n } : q)) }));
    else update((d: DB) => ({ ...d, quadras: [...d.quadras, { id: uid('q'), nome: n }] }));
    toast('Quadra salva.'); setForm(null);
  };
  const del = (q: Quadra) => {
    const used = db.games.filter((g: Game) => g.quadraId === q.id).length;
    if (used) { toast(`Não é possível excluir: ${used} partida(s) usam esta quadra.`, 'error'); return; }
    confirm({ title: 'Excluir quadra', message: `Deseja excluir "${q.nome}"?`, confirmLabel: 'Excluir', danger: true, onConfirm: () => { update((d: DB) => ({ ...d, quadras: d.quadras.filter((x) => x.id !== q.id) })); toast('Quadra excluída.'); } });
  };
  return (
    <div className="space-y-4">
      <PageHeader title="Quadras" back="mais" subtitle="Espaços esportivos disponíveis" action={<Btn icon="Plus" onClick={() => openForm({})}>Nova</Btn>} />
      {db.quadras.length === 0 ? <Empty icon="MapPin" title="Nenhuma quadra cadastrada" /> : (
        <ul className="bg-white rounded-2xl border border-brand-line shadow-soft divide-y divide-brand-line">
          {db.quadras.map((q: Quadra) => (
            <li key={q.id} className="flex items-center gap-3 px-4 py-3">
              <span className="h-10 w-10 rounded-xl bg-brand-soft text-brand flex items-center justify-center"><Icon name="MapPin" size={18} /></span>
              <div className="flex-1 min-w-0"><p className="font-semibold text-ink truncate">{q.nome}</p><p className="text-xs text-mute">{db.games.filter((g: Game) => g.quadraId === q.id && g.status !== 'cancelado').length} partida(s) agendada(s)</p></div>
              <IconBtn icon="Pencil" label={`Editar ${q.nome}`} onClick={() => openForm(q)} />
              <IconBtn icon="Trash2" tone="danger" label={`Excluir ${q.nome}`} onClick={() => del(q)} />
            </li>
          ))}
        </ul>
      )}
      {form && (
        <Modal title={form.id ? 'Editar quadra' : 'Nova quadra'} onClose={() => setForm(null)}>
          <form onSubmit={save} noValidate className="space-y-4">
            <Field label="Nome da quadra" htmlFor="q-nome" error={err}><input id="q-nome" className={INPUT} value={nome} onChange={(e: any) => { setNome(e.target.value); setErr(''); }} /></Field>
            <Btn type="submit" icon="Save" className="w-full">Salvar quadra</Btn>
          </form>
        </Modal>
      )}
    </div>
  );
};

/* ---------- AUTENTICAÇÃO ---------- */
const Auth = ({ users, onLogin, onRegister }: any) => {
  const [mode, setMode] = useState('entrar');
  const [role, setRole] = useState('aluno' as Role);
  const [f, setF] = useState({ name: '', email: '', password: '', confirm: '', escola: '', t: emptyTurma() });
  const [show, setShow] = useState(false);
  const [err, setErr] = useState({} as any);
  const set = (k: string, v: any) => { setF((p: any) => ({ ...p, [k]: v })); setErr((p: any) => ({ ...p, [k]: undefined, geral: undefined })); };
  const studentLike = role === 'aluno' || role === 'monitor';

  const submit = (e: any) => {
    e.preventDefault();
    const x: any = {};
    if (!emailOk(f.email)) x.email = 'Informe um e-mail válido.';
    if (!f.password) x.password = 'Informe a senha.';
    if (mode === 'entrar') {
      if (!Object.keys(x).length) {
        const u = users.find((u: User) => u.email.toLowerCase() === f.email.trim().toLowerCase());
        if (!u) x.geral = 'Nenhuma conta encontrada com este e-mail. Use Criar conta ou o preenchimento de demonstração.';
        else if (u.password !== f.password) x.password = 'Senha incorreta.';
        else if (u.role !== role) x.geral = `Esta conta é de ${ROLES[u.role as Role].label}. Selecione esse perfil para entrar.`;
        else { onLogin(u.id, u.role); return; }
      }
    } else {
      if (!f.name.trim()) x.name = 'Informe seu nome.';
      if (f.password && f.password.length < 6) x.password = 'A senha deve ter ao menos 6 caracteres.';
      if (f.confirm !== f.password) x.confirm = 'As senhas não são iguais.';
      if (studentLike && (!f.t.serie || !f.t.turma)) x.t = 'Selecione a série e a turma.';
      if (!studentLike && !f.escola.trim()) x.escola = 'Informe o nome da escola.';
      if (!x.email && users.some((u: User) => u.email.toLowerCase() === f.email.trim().toLowerCase())) x.email = 'Este e-mail já está cadastrado. Volte e use Entrar.';
      if (!Object.keys(x).length) {
        onRegister({ id: uid('u'), name: f.name.trim(), email: f.email.trim(), password: f.password, role, escola: studentLike ? '' : f.escola.trim(), serie: studentLike ? f.t.serie : '', turma: studentLike ? f.t.turma : '', photo: '' }, role);
        return;
      }
    }
    setErr(x);
  };

  return (
    <div className="min-h-screen -mx-4 px-4 pb-10 pt-[max(24px,env(safe-area-inset-top))] bg-gradient-to-b from-brand-dark via-brand-dark to-brand flex flex-col items-center">
      <div className="w-full max-w-md">
        <header className="flex flex-col items-center text-white text-center pt-6 pb-6">
          <Logo size={72} />
          <h1 className="font-display text-5xl tracking-wide uppercase mt-3 leading-none">Quadra Escolar</h1>
          <p className="text-white/75 text-sm mt-2">Partidas, quadras e rankings da sua escola</p>
        </header>
        <div className="bg-white rounded-3xl shadow-card p-5 space-y-5">
          <fieldset>
            <legend className="font-display text-2xl text-brand-dark mb-2">Entrar como:</legend>
            <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Perfil de acesso">
              {ROLE_ORDER.map((r) => (
                <button key={r} type="button" role="radio" aria-checked={role === r} onClick={() => { setRole(r); setErr({}); }}
                  className={`rounded-2xl border-2 p-3 text-left transition-colors ${role === r ? 'border-accent bg-accent-soft' : 'border-brand-line bg-white hover:bg-brand-soft'}`}>
                  <span className={`h-9 w-9 rounded-lg flex items-center justify-center ${role === r ? 'bg-brand-dark text-white' : 'bg-brand-soft text-brand'}`}><Icon name={ROLES[r].icon} size={18} /></span>
                  <span className="block font-semibold text-ink mt-2 text-sm">{ROLES[r].label}</span>
                  <span className="block text-[11px] text-mute leading-tight mt-0.5">{ROLES[r].desc}</span>
                </button>
              ))}
            </div>
          </fieldset>

          <Tabs value={mode} onChange={(m: string) => { setMode(m); setErr({}); }} items={[{ id: 'entrar', label: 'Entrar' }, { id: 'criar', label: 'Criar conta' }]} />

          <form onSubmit={submit} noValidate className="space-y-4">
            {err.geral && <div role="alert" className="rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-800 flex gap-2"><Icon name="AlertTriangle" size={16} className="shrink-0 mt-0.5" />{err.geral}</div>}
            {mode === 'criar' && <Field label="Nome completo" htmlFor="a-nome" error={err.name}><input id="a-nome" autoComplete="name" className={INPUT} value={f.name} onChange={(e: any) => set('name', e.target.value)} /></Field>}
            <Field label="E-mail" htmlFor="a-email" error={err.email}>
              <div className="relative"><Icon name="Mail" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-mute" /><input id="a-email" type="email" autoComplete="email" inputMode="email" className={INPUT + ' pl-9'} value={f.email} onChange={(e: any) => set('email', e.target.value)} placeholder="nome@escola.com" /></div>
            </Field>
            <Field label="Senha" htmlFor="a-senha" error={err.password}>
              <div className="relative">
                <Icon name="Lock" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-mute" />
                <input id="a-senha" type={show ? 'text' : 'password'} autoComplete={mode === 'entrar' ? 'current-password' : 'new-password'} className={INPUT + ' pl-9 pr-11'} value={f.password} onChange={(e: any) => set('password', e.target.value)} />
                <button type="button" onClick={() => setShow(!show)} aria-label={show ? 'Ocultar senha' : 'Mostrar senha'} className="absolute right-1 top-1/2 -translate-y-1/2 h-9 w-9 rounded-lg text-mute hover:bg-brand-soft inline-flex items-center justify-center"><Icon name={show ? 'EyeOff' : 'Eye'} size={18} /></button>
              </div>
            </Field>
            {mode === 'criar' && (
              <>
                <Field label="Confirmar senha" htmlFor="a-conf" error={err.confirm}><input id="a-conf" type={show ? 'text' : 'password'} autoComplete="new-password" className={INPUT} value={f.confirm} onChange={(e: any) => set('confirm', e.target.value)} /></Field>
                {studentLike
                  ? <Field label="Série e turma" error={err.t}><SerieTurma id="reg" value={f.t} onChange={(t: Turma) => set('t', t)} /></Field>
                  : <Field label="Escola" htmlFor="a-escola" error={err.escola}><input id="a-escola" className={INPUT} value={f.escola} onChange={(e: any) => set('escola', e.target.value)} /></Field>}
              </>
            )}
            <Btn type="submit" variant="primary" icon={mode === 'entrar' ? 'LogIn' : 'UserPlus'} className="w-full h-12 text-base">{mode === 'entrar' ? 'Entrar' : 'Criar conta'}</Btn>
            {mode === 'entrar' && (
              <button type="button" onClick={() => { setF((p: any) => ({ ...p, email: DEMO_EMAIL[role], password: DEMO_PASSWORD })); setErr({}); }} className="w-full text-sm font-semibold text-brand hover:text-brand-dark inline-flex items-center justify-center gap-1.5">
                <Icon name="Zap" size={15} />Preencher dados de demonstração para {ROLES[role].label}
              </button>
            )}
          </form>
          <p className="text-xs text-mute text-center">Nesta versão de demonstração o perfil é de livre escolha, sem confirmação de cargo.</p>
        </div>
      </div>
    </div>
  );
};

/* ---------- ESTRUTURA PRINCIPAL ---------- */
const NAV = [
  { id: 'inicio', label: 'Início', icon: 'Home' },
  { id: 'agendamentos', label: 'Agendamentos', icon: 'CalendarDays' },
  { id: 'rankings', label: 'Rankings', icon: 'Trophy' },
  { id: 'mais', label: 'Mais', icon: 'Menu' },
];
const navOf = (name: string) => (name === 'inicio' || name === 'agendamentos' || name === 'rankings' ? name : name === 'agendamento-form' ? 'agendamentos' : 'mais');

const App = () => {
  const [db, setDb] = useState(() => loadDB());
  const [session, setSession] = useState(() => { try { const s = sGet(SESSION_KEY, 'session'); return s ? JSON.parse(s) : null; } catch { return null; } });
  const [route, setRoute] = useState({ name: 'inicio', params: {} as any });
  const [toasts, setToasts] = useState([] as any[]);
  const [dlg, setDlg] = useState(null as any);
  const [detail, setDetail] = useState(null as any);

  const update = useCallback((fn: (d: DB) => DB) => {
    setDb((prev: DB) => { const n = fn(prev); sSet(DB_KEY, JSON.stringify(n)); return n; });
  }, []);
  useEffect(() => {
    const h = (e: StorageEvent) => { if (e.key === DB_KEY) setDb(loadDB()); };
    window.addEventListener('storage', h);
    return () => window.removeEventListener('storage', h);
  }, []);

  const user: User | undefined = session ? db.users.find((u: User) => u.id === session.userId) : undefined;
  const role: Role = session ? session.role : 'aluno';
  const toast = useCallback((msg: string, type = 'ok') => {
    const id = uid('t');
    setToasts((t: any[]) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t: any[]) => t.filter((x) => x.id !== id)), 3600);
  }, []);
  const go = useCallback((name: string, params: any = {}) => { setRoute({ name, params }); setDetail(null); window.scrollTo(0, 0); }, []);
  const login = (userId: string, r: Role) => { const s = { userId, role: r }; sSet(SESSION_KEY, JSON.stringify(s), 'session'); setSession(s); setRoute({ name: 'inicio', params: {} }); };
  const logout = useCallback(() => { sDel(SESSION_KEY, 'session'); setSession(null); setRoute({ name: 'inicio', params: {} }); setDetail(null); }, []);
  const register = (u: User, r: Role) => { update((d: DB) => ({ ...d, users: [...d.users, u] })); login(u.id, r); };
  const patchUser = useCallback((p: Partial<User>) => {
    if (!session) return;
    update((d: DB) => ({ ...d, users: d.users.map((u) => (u.id === session.userId ? { ...u, ...p } : u)) }));
  }, [session, update]);
  const resetDemo = () => { const s = seed(); sSet(DB_KEY, JSON.stringify(s)); setDb(s); logout(); };

  const ctx = useMemo(() => ({
    db, update, user, role, toast, go, logout, patchUser, resetDemo,
    isAdmin: role === 'admin',
    can: (k: string) => role === 'admin' || !!(db.perms[role] && db.perms[role][k]),
    userById: (id: string) => db.users.find((u: User) => u.id === id),
    quadraById: (id: string) => db.quadras.find((q: Quadra) => q.id === id),
    openGame: (id: string) => setDetail(id),
    confirm: (d: any) => setDlg(d),
  }), [db, user, role, update, toast, go, logout, patchUser]);

  if (!session || !user) return <Ctx.Provider value={ctx}><Auth users={db.users} onLogin={login} onRegister={register} /><Toasts items={toasts} /></Ctx.Provider>;

  const pages: any = {
    inicio: <Dashboard />,
    agendamentos: <Agendamentos />,
    'agendamento-form': <GameForm key={route.params.id || 'novo'} id={route.params.id} />,
    rankings: <Rankings />,
    mais: <Mais />,
    perfil: <Perfil />,
    informacoes: <Informacoes />,
    'minhas-partidas': <MinhasPartidas />,
    avaliacoes: <Avaliacoes key={route.params.gameId || 'todas'} gameId={route.params.gameId} />,
    usuarios: <Usuarios />,
    permissoes: <Permissoes />,
    quadras: <Quadras />,
    config: <Config />,
    ajuda: <Ajuda />,
  };
  const active = navOf(route.name);

  return (
    <Ctx.Provider value={ctx}>
      <div className="mx-auto max-w-5xl md:grid md:grid-cols-[220px_minmax(0,1fr)] md:gap-8 py-4 md:py-8">
        <aside className="hidden md:block">
          <div className="sticky top-8 space-y-4">
            <div className="flex items-center gap-3"><Logo size={44} /><span className="font-display text-2xl uppercase leading-none text-brand-dark">Quadra<br />Escolar</span></div>
            <nav aria-label="Navegação principal" className="bg-white rounded-2xl border border-brand-line shadow-soft p-2 space-y-1">
              {NAV.map((n) => (
                <button key={n.id} type="button" onClick={() => go(n.id)} aria-current={active === n.id ? 'page' : undefined}
                  className={`w-full flex items-center gap-3 px-3 h-11 rounded-xl font-semibold text-sm transition-colors ${active === n.id ? 'bg-brand text-white' : 'text-ink hover:bg-brand-soft'}`}>
                  <Icon name={n.icon} size={18} />{n.label}
                </button>
              ))}
            </nav>
            <div className="bg-white rounded-2xl border border-brand-line shadow-soft p-3 flex items-center gap-3">
              <Avatar user={user} size={40} />
              <div className="min-w-0 flex-1"><p className="text-sm font-semibold text-ink truncate">{user.name}</p><p className="text-xs text-mute">{ROLES[role].label}</p></div>
              <IconBtn icon="LogOut" label="Sair da conta" onClick={logout} />
            </div>
          </div>
        </aside>
        <main className="min-w-0 pb-28 md:pb-8">{pages[route.name] || <Dashboard />}</main>
      </div>

      <nav aria-label="Navegação principal" className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-brand-line shadow-[0_-4px_16px_rgba(7,91,61,0.08)] pl-[max(8px,env(safe-area-inset-left,0px))] pr-[max(8px,env(safe-area-inset-right,0px))] pb-[env(safe-area-inset-bottom,0px)]">
        <div className="grid grid-cols-4">
          {NAV.map((n) => (
            <button key={n.id} type="button" onClick={() => go(n.id)} aria-current={active === n.id ? 'page' : undefined} className={`relative flex flex-col items-center justify-center gap-0.5 h-16 text-[11px] font-semibold transition-colors ${active === n.id ? 'text-brand' : 'text-mute'}`}>
              {active === n.id && <span className="absolute top-0 h-1 w-10 rounded-b-full bg-accent" />}
              <Icon name={n.icon} size={22} strokeWidth={active === n.id ? 2.4 : 2} />{n.label}
            </button>
          ))}
        </div>
      </nav>

      {detail && <GameDetail id={detail} onClose={() => setDetail(null)} />}
      {dlg && (
        <Modal title={dlg.title} onClose={() => setDlg(null)}>
          <p className="text-sm text-mute">{dlg.message}</p>
          <div className="mt-5 flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
            <Btn variant="ghost" onClick={() => setDlg(null)}>Voltar</Btn>
            <Btn variant={dlg.danger ? 'dark' : 'primary'} className={dlg.danger ? '!bg-red-700 hover:!bg-red-800' : ''} onClick={() => { const f = dlg.onConfirm; setDlg(null); f && f(); }}>{dlg.confirmLabel || 'Confirmar'}</Btn>
          </div>
        </Modal>
      )}
      <Toasts items={toasts} />
    </Ctx.Provider>
  );
};

const Toasts = ({ items }: any) => (
  <div className="fixed top-[max(12px,env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[60] w-[min(92vw,420px)] space-y-2 pointer-events-none" aria-live="polite">
    {items.map((t: any) => (
      <div key={t.id} className={`flex items-start gap-2 rounded-xl px-4 py-3 text-sm font-semibold shadow-card ${t.type === 'error' ? 'bg-red-700 text-white' : 'bg-brand-dark text-white'}`}>
        <Icon name={t.type === 'error' ? 'AlertTriangle' : 'CheckCircle2'} size={18} className="shrink-0 mt-px" />{t.msg}
      </div>
    ))}
  </div>
);

(ReactDOM as any).createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
(function(){
  try{
    var code=document.getElementById('app-src').textContent;
    var out=Babel.transform(code,{filename:'app.tsx',presets:[['typescript',{allExtensions:true,isTSX:true}],'react']}).code;
    var s=document.createElement('script');s.textContent=out;document.body.appendChild(s);
  }catch(e){
    var b=document.getElementById('boot');
    if(b){b.textContent='Não foi possível carregar o aplicativo: '+(e&&e.message?e.message:e);}
  }
})();
</script>

</body></html>
